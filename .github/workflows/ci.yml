name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Tests use in-memory SQLite and mock Ollama (see tests/conftest.py).
      - run: pytest -q

  migrations:
    name: Migrations (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: omnicortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d omnicortex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/omnicortex
      SECRET_KEY: ci-secret-key-not-used-for-anything-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - name: Upgrade, downgrade to base and upgrade again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models match the migrated schema
        run: alembic check

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t omnicortex-api .
      - run: docker build -t omnicortex-web ./frontend
