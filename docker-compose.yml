services:
  db:
    image: pgvector/pgvector:pg16
    container_name: omnicortex_postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: omnicortex_api
    restart: unless-stopped

    env_file: .env

    environment:
      # Inside the container the database is reachable as "db", not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Ollama runs on the host machine.
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
